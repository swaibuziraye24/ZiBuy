<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Handover &amp; Receipt Note — ZiBuy</title>
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:#f3f4f6; margin:0; color:#111827; }
    .bar { max-width:760px; margin:12px auto; display:flex; gap:8px; padding:0 12px; }
    .bar button { padding:10px 16px; border-radius:10px; border:none; font-weight:700; cursor:pointer; font-size:14px; }
    .note { max-width:760px; margin:0 auto 30px; background:white; padding:28px; border-radius:14px; box-shadow:0 2px 12px rgba(0,0,0,.08); }
    h1 { font-size:20px; margin:0 0 4px; }
    h2 { font-size:14px; margin:22px 0 8px; text-transform:uppercase; letter-spacing:.5px; color:#6b7280; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { text-align:left; padding:8px 6px; border-bottom:1px solid #e5e7eb; vertical-align:top; }
    th { color:#6b7280; font-weight:700; }
    .stmt { font-size:13.5px; line-height:1.7; margin:0 0 10px; }
    .sig { border:1.5px solid #e5e7eb; border-radius:12px; padding:14px; margin-bottom:12px; }
    .sig.done { background:#f0fdf4; border-color:#86efac; }
    .sig input[type=password] { width:100%; padding:11px; border:1.5px solid #d1d5db; border-radius:10px; font-size:15px; margin:8px 0; box-sizing:border-box; }
    .sig button { width:100%; background:#10b981; color:white; border:none; padding:13px; border-radius:10px; font-weight:800; font-size:14px; cursor:pointer; }
    .ok  { background:#f0fdf4; border:1.5px solid #86efac; color:#166534; padding:12px; border-radius:10px; font-weight:700; font-size:13px; }
    .bad { background:#fef2f2; border:1.5px solid #fca5a5; color:#991b1b; padding:12px; border-radius:10px; font-weight:700; font-size:13px; }
    .small { font-size:11px; color:#6b7280; line-height:1.6; word-break:break-all; }
    @media print { body { background:white; } .bar { display:none; } .note { box-shadow:none; margin:0; max-width:none; } .sig button, .sig input { display:none; } }
  </style>
</head>
<body>
  <div class="bar">
    <button onclick="window.print()" style="background:#ff6600;color:white">🖨️ Print / Save as PDF</button>
    <button onclick="history.back()" style="background:#e5e7eb">← Back</button>
  </div>
  <div class="note" id="note">Loading note...</div>
  <script type="module" src="handover-note.js"></script>
</body>
</html>
