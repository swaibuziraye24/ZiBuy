<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ff6600">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <title>Recently Viewed — ZiBuy</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="manifest" href="/manifest.json">
</head>
<body>

<header class="topbar">
  <a href="index.html"><h1 class="logo">Zi<span>Buy</span></h1></a>
  <div style="margin-left:auto">
    <button class="btn btn-dark" onclick="smartGoBack('index.html')">← Back</button>
  </div>
</header>

<div style="max-width:1000px;margin:0 auto;padding:20px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
    <h1 style="font-size:22px;font-weight:800;margin:0">🕒 Recently Viewed</h1>
    <a href="javascript:void(0)"
      onclick="if(confirm('Clear your recently viewed history?')){clearRecentlyViewed();document.getElementById('recently-viewed-page-section').style.display='none';document.getElementById('recently-viewed-empty').style.display='block'}"
      style="font-size:13px;font-weight:700;color:#9ca3af;text-decoration:none">Clear History</a>
  </div>

  <section id="recently-viewed-page-section" style="display:none">
    <div id="recently-viewed-page-grid"
      style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px"></div>
  </section>

  <div id="recently-viewed-empty" style="display:none;text-align:center;padding:60px 20px;color:#6b7280">
    <p style="font-size:48px;margin-bottom:12px">🕒</p>
    <p style="font-size:16px;font-weight:700">Nothing viewed yet</p>
    <p style="font-size:13px;margin-bottom:16px">Products you look at will show up here</p>
    <a href="index.html" class="btn btn-orange" style="display:inline-block;padding:12px 24px;text-decoration:none">🛍️ Browse Products</a>
  </div>
</div>

<div id="overlay" class="overlay"></div>
<div id="toast-container" class="toast-container"></div>

<script type="module">
  import { renderRecentlyViewed, clearRecentlyViewed } from "./recently-viewed.js";
  window.clearRecentlyViewed = clearRecentlyViewed;

  renderRecentlyViewed("recently-viewed-page-section", "recently-viewed-page-grid", null, 20)
    .then(() => {
      const section = document.getElementById("recently-viewed-page-section");
      const empty   = document.getElementById("recently-viewed-empty");
      if (section.style.display === "none") {
        empty.style.display = "block";
      }
    });
</script>

<script type="module" src="notifications-setup.js"></script>
<script src="nav.js"></script>

</body>
</html>
